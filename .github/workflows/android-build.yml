name: Build Android APK
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable update signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aamirror-update-signing-v1
      - name: Ensure stable update signing key
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android               -alias androiddebugkey -keypass android -dname "CN=AA Mirror Update,O=AA Mirror,C=VN"               -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "AA-Mirror-v${{ steps.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AA-Mirror-v${{ steps.version.outputs.version }}
          path: AA-Mirror-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"; APK="AA-Mirror-v$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA"               --title "AA Mirror v$VERSION" --notes "AA Mirror v$VERSION - Android Auto mirror build."
          fi
